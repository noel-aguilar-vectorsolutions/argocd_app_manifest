#https://argo-cd.readthedocs.io/en/latest/user-guide/application-specification/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'echo-server-node-develop'
  namespace: argocd
spec:
  project: default
  # Source of the application manifests
  source:
    repoURL: https://github.com/VectorLearning/poc_echo_server_node.git
    targetRevision: HEAD
    path: './src/helm/echo-server-node'
    # Helm specific config
    helm:
      passCredentials: false
      releaseName: develop
      valueFiles:
        - values-dev.yaml
  # Destination cluster and namespace to deploy the application
  destination:
    server: https://77800F04079BF0A8DE63EAEFBD26A1AB.gr7.us-east-2.eks.amazonaws.com
    namespace: develop
  # Sync policy
  syncPolicy:
    automated: #enables auto-sync
      prune: true
      selfHeal: true

  
---

