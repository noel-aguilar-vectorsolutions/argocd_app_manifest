# Application used in local development
#https://argo-cd.readthedocs.io/en/latest/user-guide/application-specification/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'echo-server-node-develop'
  namespace: argocd
spec:
  project: default
  # Source of the application manifests
  source:
    repoURL: git@github.com:VectorLearning/poc_echo_server_node.git
    targetRevision: HEAD
    path: './src/helm/echo-server-node'
    # Helm specific config
    helm:
      passCredentials: false
      releaseName: develop
      valueFiles:
        - values-develop.yaml
  # Destination cluster and namespace to deploy the application
  destination:
    name: in-cluster
    namespace: develop
  # Sync policy
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    automated: #enables auto-sync
      prune: true
      selfHeal: true

  
---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'echo-server-node-staging'
  namespace: argocd
spec:
  project: default
  # Source of the application manifests
  source:
    repoURL: git@github.com:VectorLearning/poc_echo_server_node.git
    targetRevision: main
    path: './src/helm/echo-server-node'
    # Helm specific config
    helm:
      passCredentials: false
      releaseName: staging
      valueFiles:
        - values-staging.yaml
  # Destination cluster and namespace to deploy the application
  destination:
    name: in-cluster
    namespace: staging
  # Sync policy
  syncPolicy: 
    syncOptions:
    - CreateNamespace=false

